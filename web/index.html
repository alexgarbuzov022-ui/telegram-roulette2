<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Рулетка</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{color-scheme:dark;--bg:#100d20;--panel:#1c1731;--muted:#bdb5d7}*{box-sizing:border-box}body{margin:0;padding:20px 16px;background:radial-gradient(ellipse at top,#33215e,var(--bg) 65%);color:#fff;font-family:system-ui,sans-serif}main{max-width:520px;margin:auto;text-align:center}h1{font-size:28px}.sub,.note{color:var(--muted)}.stats{display:flex;gap:10px;margin:18px 0}.stat{flex:1;background:var(--panel);border:1px solid #40335f;padding:12px;border-radius:16px}.num{display:block;font-size:22px;font-weight:800;color:#f6d365}.wheel-wrap{position:relative;width:min(84vw,360px);margin:18px auto 22px}canvas{width:100%;height:auto;filter:drop-shadow(0 12px 24px #0008)}.pointer{position:absolute;top:-7px;left:50%;transform:translateX(-50%);border-left:17px solid transparent;border-right:17px solid transparent;border-top:35px solid #fff}button{width:100%;border:0;border-radius:15px;padding:16px;font-weight:800;font-size:17px;color:#171026;background:linear-gradient(100deg,#f6d365,#fda085)}#result{min-height:30px;margin:15px 0;font-size:18px;font-weight:700}.history{text-align:left;background:var(--panel);padding:14px;border-radius:16px;margin-top:20px}.history p,.note{color:var(--muted);font-size:13px}</style></head><body><main><h1>🎰 Рулетка призов</h1><p class="sub">Крути колесо — забирай бонусы</p><div class="stats"><div class="stat">Вращения<span id="spins" class="num">—</span></div><div class="stat">Баллы<span id="points" class="num">—</span></div></div><div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel" width="720" height="720"></canvas></div><button id="spin" disabled>Загрузка…</button><div id="result"></div><section class="history"><b>Последние выигрыши</b><div id="history"><p>Загрузка…</p></div></section><p class="note">Результат выбирается сервером. Баллы виртуальные и не имеют денежной стоимости.</p></main><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const initData=tg?.initData||"";const S=[["5 баллов","#6d5dfc"],["10 баллов","#e85d9e"],["25 баллов","#ff9f43"],["100 баллов","#20c997"],["Ещё повезёт","#4b3b77"]],c=document.querySelector("canvas"),x=c.getContext("2d"),arc=2*Math.PI/S.length;let rot=0,busy=false;
function draw(){x.clearRect(0,0,720,720);S.forEach((s,i)=>{let a=rot+i*arc-Math.PI/2;x.beginPath();x.moveTo(360,360);x.arc(360,360,330,a,a+arc);x.closePath();x.fillStyle=s[1];x.fill();x.strokeStyle="#fff7";x.lineWidth=5;x.stroke();x.save();x.translate(360,360);x.rotate(a+arc/2);x.textAlign="right";x.fillStyle="white";x.font="bold 27px system-ui";x.fillText(s[0],306,9);x.restore()});x.beginPath();x.arc(360,360,62,0,7);x.fillStyle="white";x.fill();x.fillStyle="#21153e";x.font="bold 27px system-ui";x.textAlign="center";x.textBaseline="middle";x.fillText("GO",360,360)}draw();
async function req(path,method="GET"){let r=await fetch(path,{method,headers:{Authorization:"tma "+initData}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||"Ошибка");return d}function esc(s){return String(s).replace(/[&<>"']/g,a=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[a]))}
async function refresh(){let d=await req("/api/me");document.querySelector("#spins").textContent=d.spins;document.querySelector("#points").textContent=d.points;document.querySelector("#history").innerHTML=d.history.length?d.history.map(v=>"<p>🎁 "+esc(v.prize)+"</p>").join(""):"<p>Пока нет выигрышей</p>";let b=document.querySelector("#spin");b.textContent=d.spins?"КРУТИТЬ РУЛЕТКУ":`Купить вращение: ${d.spin_price_stars} ⭐`;b.dataset.ready=d.spins?"1":"0";b.disabled=false}
document.querySelector("#spin").onclick=async()=>{let b=document.querySelector("#spin");if(busy)return;if(b.dataset.ready!=="1"){document.querySelector("#result").textContent="Купи вращение в чате с ботом и открой рулетку заново.";return}busy=true;b.disabled=true;try{let o=await req("/api/spin","POST"),i=Math.max(0,S.findIndex(s=>s[0]===o.prize)),target=(2*Math.PI-(i+.5)*arc)%(2*Math.PI),delta=(target-rot%(2*Math.PI)+2*Math.PI)%(2*Math.PI),from=rot,to=rot+12*Math.PI+delta,start=performance.now();await new Promise(done=>{function f(now){let t=Math.min(1,(now-start)/4200);rot=from+(to-from)*(1-Math.pow(1-t,4));draw();if(t<1)requestAnimationFrame(f);else done()}requestAnimationFrame(f)});document.querySelector("#result").textContent="🎉 Выпало: "+o.prize;tg?.HapticFeedback?.notificationOccurred("success");await refresh()}catch(e){document.querySelector("#result").textContent=e.message;await refresh().catch(()=>{})}finally{busy=false;b.disabled=false}};refresh().catch(e=>document.querySelector("#result").textContent="Открой Mini App через Telegram. "+e.message);
</script></body></html>
