<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Горизонтальная рулетка</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#09090d;--panel:#15151c;--muted:#b8b5c4;--gold:#f6d365;--line:#34313d}*{box-sizing:border-box}body{margin:0;padding:22px 14px max(24px,env(safe-area-inset-bottom));background:radial-gradient(ellipse at top,#342516 0,#15110d 35%,var(--bg) 75%);color:#fff;font-family:system-ui,-apple-system,sans-serif}main{max-width:560px;margin:auto}header{text-align:center}h1{font-size:27px;margin:8px 0}.sub,.note{color:var(--muted)}.sub{margin:0 0 20px}.stats{display:flex;gap:10px;margin:18px 0}.stat{flex:1;background:linear-gradient(145deg,#1e1c22,#111116);border:1px solid #554526;padding:12px;border-radius:15px;text-align:center;color:var(--muted);font-size:13px}.num{display:block;font-size:22px;font-weight:850;color:var(--gold);margin-top:3px}.section-title{font-size:16px;font-weight:800;margin:22px 2px 10px}.roulette-shell{position:relative;border:1px solid #a78335;border-radius:18px;padding:14px 0;background:linear-gradient(180deg,#211b12,#111015);box-shadow:0 0 24px #e4ad3c18;overflow:hidden}.roulette-shell:before,.roulette-shell:after{content:"";position:absolute;top:0;bottom:0;width:36px;z-index:2;pointer-events:none}.roulette-shell:before{left:0;background:linear-gradient(90deg,#111015,transparent)}.roulette-shell:after{right:0;background:linear-gradient(270deg,#111015,transparent)}.pointer{position:absolute;z-index:4;left:50%;top:0;bottom:0;width:3px;background:var(--gold);transform:translateX(-50%);box-shadow:0 0 12px #ffd86b}.pointer:before{content:"▼";position:absolute;top:-1px;left:50%;transform:translateX(-50%);color:var(--gold);font-size:17px;text-shadow:0 0 10px #ffd86b}.pointer:after{content:"▲";position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);color:var(--gold);font-size:17px;text-shadow:0 0 10px #ffd86b}.viewport{overflow:hidden;padding:0 0}.track{display:flex;gap:9px;transform:translateX(0);will-change:transform;padding:8px 0}.prize{flex:0 0 112px;min-height:116px;border:1px solid var(--edge,#6d5dfc);border-radius:12px;background:linear-gradient(160deg,var(--tint,#282033),#15141a 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 6px;text-align:center;box-shadow:inset 0 0 14px color-mix(in srgb,var(--edge,#6d5dfc) 18%,transparent)}.prize .emoji{font-size:30px;line-height:1.3;margin-bottom:7px}.prize .name{font-size:12px;font-weight:800;line-height:1.25}.prize.winner{border-color:#ffe58b;box-shadow:0 0 22px #ffcf4d7a,inset 0 0 18px #ffcf4d26}.prize .rarity{font-size:10px;color:var(--muted);margin-top:5px}button{width:100%;border:1px solid #ffe18a;border-radius:14px;padding:16px;font-weight:900;font-size:16px;color:#1b1408;background:linear-gradient(100deg,#f6d365,#c58a28);margin-top:14px;box-shadow:0 5px 20px #d69c3022}button:disabled{opacity:.65}#result{min-height:30px;margin:15px 0;text-align:center;font-size:17px;font-weight:800;color:#ffe18a}.history{background:var(--panel);border:1px solid #302a22;padding:14px;border-radius:15px;margin-top:20px}.history p,.note{font-size:13px;color:var(--muted)}.history p{margin:8px 0}.note{text-align:center;margin-top:18px}.tag{color:#e9c56c;font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
</style></head><body><main><header><div class="tag">Premium rewards</div><h1>✨ Горизонтальная рулетка</h1><p class="sub">Испытай удачу и забери приз</p></header><div class="stats"><div class="stat">Вращения<span id="spins" class="num">—</span></div><div class="stat">Баллы<span id="points" class="num">—</span></div></div><div class="section-title">Выбери свой приз</div><div class="roulette-shell"><div class="pointer"></div><div class="viewport"><div class="track" id="track"></div></div></div><button id="spin" disabled>Загрузка…</button><div id="result" aria-live="polite"></div><section class="history"><b>Последние выигрыши</b><div id="history"><p>Загрузка…</p></div></section><p class="note">Результат выбирается сервером. Баллы виртуальные и не имеют денежной стоимости.</p></main>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const initData=tg?.initData||"";
const S=[["5 баллов","#b18b36","🪙","Обычный"],["10 баллов","#6d5dfc","💎","Редкий"],["25 баллов","#e85d9e","🎁","Эпический"],["100 баллов","#20c997","👑","Легендарный"],["Ещё повезёт","#8a6bba","✨","Особый"]];
const track=document.querySelector('#track');let busy=false,displayItems=[];
function esc(s){return String(s).replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]))}
function makeCard(item){const el=document.createElement('div');el.className='prize';el.style.setProperty('--edge',item[1]);el.style.setProperty('--tint',item[1]+'25');el.innerHTML='<div class="emoji">'+item[2]+'</div><div class="name">'+esc(item[0])+'</div><div class="rarity">'+esc(item[3])+'</div>';return el}
function fillTrack(){track.innerHTML='';displayItems=[];for(let i=0;i<55;i++){const item=S[Math.floor(Math.random()*S.length)];displayItems.push(item);track.appendChild(makeCard(item))}track.style.transition='none';track.style.transform='translateX(0)'}
async function req(path,method='GET'){const r=await fetch(path,{method,headers:{Authorization:'tma '+initData}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Ошибка');return d}
async function refresh(){const d=await req('/api/me');document.querySelector('#spins').textContent=d.spins;document.querySelector('#points').textContent=d.points;document.querySelector('#history').innerHTML=d.history.length?d.history.map(v=>'<p>🎁 '+esc(v.prize)+'</p>').join(''):'<p>Пока нет выигрышей</p>';const b=document.querySelector('#spin');b.textContent=d.spins?'КРУТИТЬ РУЛЕТКУ':`Купить вращение: ${d.spin_price_stars} ⭐`;b.dataset.ready=d.spins?'1':'0';b.disabled=false}
fillTrack();
document.querySelector('#spin').onclick=async()=>{const b=document.querySelector('#spin');if(busy)return;if(b.dataset.ready!=='1'){document.querySelector('#result').textContent='Купи вращение в чате с ботом и открой рулетку заново.';return}busy=true;b.disabled=true;document.querySelector('#result').textContent='';try{const o=await req('/api/spin','POST');const idx=Math.max(0,S.findIndex(s=>s[0]===o.prize));const chosen=S[idx]||S[0];fillTrack();const winIndex=44;displayItems[winIndex]=chosen;track.replaceChild(makeCard(chosen),track.children[winIndex]);track.children[winIndex].classList.add('winner');const cardWidth=112,gap=9,step=cardWidth+gap;const viewport=document.querySelector('.viewport');const center=viewport.clientWidth/2;const target=winIndex*step+cardWidth/2-center;track.style.transition='none';track.style.transform='translateX(0)';track.getBoundingClientRect();track.style.transition='transform 4.2s cubic-bezier(.08,.72,.12,1)';track.style.transform=`translateX(${-target}px)`;await new Promise(resolve=>setTimeout(resolve,4350));document.querySelector('#result').textContent='🎉 Выпало: '+o.prize;tg?.HapticFeedback?.notificationOccurred('success');await refresh()}catch(e){document.querySelector('#result').textContent=e.message;await refresh().catch(()=>{})}finally{busy=false;b.disabled=false}};
refresh().catch(e=>document.querySelector('#result').textContent='Открой Mini App через Telegram. '+e.message);
</script></body></html>
